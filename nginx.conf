events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 10000;
        server_name _;

        # 1. Health check endpoint cho UptimeRobot -> Luôn trả 200 OK
        location = /health {
            default_type application/json;
            return 200 '{"status":"healthy","service":"render-proxy-singapore","uptime":"24/7"}';
        }

        # 2. WebSocket Tunnel chuyên dụng cho Gost Proxy (/ws)
        location /ws {
            proxy_pass http://127.0.0.1:10001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 3. Trang chủ Web 200 OK cho UptimeRobot và Browser
        location / {
            default_type text/html;
            return 200 '<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>Render Proxy Singapore</title><style>body{background:#0b0f19;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}.card{background:#1e293b;padding:32px 48px;border-radius:16px;border:1px solid #334155;text-align:center;box-shadow:0 10px 25px -5px rgba(0,0,0,0.5);}.badge{background:#064e3b;color:#34d399;padding:6px 16px;border-radius:9999px;font-weight:600;font-size:14px;display:inline-block;margin-bottom:16px;border:1px solid #059669;}</style></head><body><div class="card"><div class="badge">🟢 SERVER ONLINE 24/7</div><h1 style="margin:0 0 8px 0;font-size:24px;">Render Proxy Singapore Gateway</h1><p style="color:#94a3b8;margin:0;font-size:14px;">UptimeRobot Monitor & WebSocket Egress Tunnel Active</p></div></body></html>';
        }
    }
}
